[project]
name = "olsprime"
version = "0.1.0"
description = "OLS Prime: point-in-time crypto market data, universe and a from-scratch OLS-attention encoder."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    # The Rust core (crates/olsprime-py), built by maturin; see [tool.uv.sources].
    "olsprime-rs",
    "polars>=1.20",
    "pyarrow>=17",
    "pyrage==1.4.0",
    "scipy>=1.18.1",
    # Windows has no system time zone database; zoneinfo needs it for UTC datetimes.
    "tzdata>=2024.1; sys_platform == 'win32'",
    # The CPU build: the baselines are small, and CI downloads no CUDA runtime.
    "xgboost-cpu>=3.4.1",
]

[dependency-groups]
dev = ["pytest>=8"]
# torch for the encoder (iteration 4), in two builds that never meet in one environment.
# - cpu: Windows, CI and every default `uv sync` / `uv run` (the default groups below).
# - cu134: the RTX 3060 in WSL2, in its own environment on the Linux disk:
#   UV_PROJECT_ENVIRONMENT=~/olsprime-gpu/venv uv sync --locked --no-default-groups --group dev --group cu134
cpu = ["torch==2.15.0"]
cu134 = ["torch==2.15.0; sys_platform == 'linux'"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cu134" }]]

[tool.uv.sources]
# A regular (non-editable) install, built from the crate by maturin. The crate's pyproject
# declares cache-keys on every Rust source compiled in, so `uv sync` rebuilds after any edit.
olsprime-rs = { path = "../crates/olsprime-py" }
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu134", group = "cu134" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["olsprime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
